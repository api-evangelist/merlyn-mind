aid: merlyn-mind
name: Merlyn Mind
description: >-
  Merlyn Mind is a New York-based deep-tech generative AI company, founded in 2018, that
  builds domain-specific AI for K-12 education. Its products are Merlyn Origin, a software
  AI assistant that runs on a teacher's classroom computer, and Merlyn Display, the same
  assistant embedded in interactive flat panels from partners such as Promethean and Newline.
  The company trained its own education-specific large language models and published several
  of them openly on Hugging Face (merlyn-education-safety, merlyn-education-corpus-qa,
  merlyn-education-teacher-assistant), and runs an AI Labs research group that publishes at
  NeurIPS and other conferences. Merlyn integrates with classroom tooling including the Canvas
  LMS. Merlyn Mind was acquired by Mynd.ai, Inc. (NYSE American, MYND), the parent of Promethean,
  in a deal completed 9 September 2025, and continues to operate under the merlyn.org brand with
  offices in New York, Irvine and Bangalore. Merlyn Mind publishes no public developer program:
  there is no developer portal, no API reference, no SDK and no machine-readable contract.
