  reason: no-developer-program
  detail: >-
    Merlyn Mind sells Merlyn Origin and Merlyn Display as finished classroom products and runs no
    developer program at all — its 97-URL sitemap contains no developer, docs or API page, and
    developer/docs/api.merlyn.org do not resolve; the only REST API it operates,
    web.rest-api.merlyn.org, is an undocumented AWS API Gateway backing its own console and teacher
    portal that answers every anonymous request with 403 "Missing Authentication Token".
