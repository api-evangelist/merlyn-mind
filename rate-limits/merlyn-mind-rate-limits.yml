note: >-
  No rate limits are published, because no API is published. Merlyn Mind operates a real REST API
  at https://web.rest-api.merlyn.org (an AWS API Gateway deployment referenced by its own
  manage.merlyn.org and portal.merlyn.org applications), but it is not a developer product: it
  carries no documentation, no reference, no spec, and every anonymous request returns
  403 {"message":"Missing Authentication Token"}, so no throttling headers can be observed
  without credentials. AWS API Gateway does apply account/stage throttling and, when exceeded,
  returns 429 with {"message":"Too Many Requests"} — that is a platform default, NOT a Merlyn Mind
  published limit, and it is deliberately not recorded as one here.
